# Rebuild and publish menace.bitplane.net from every package on master.
name: Publish site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: results
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bitplane/menacebench
          ref: master
          path: harness
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r harness/requirements.lock
      - name: Check every package
        env:
          PYTHONPATH: harness/src
          NETHACK_CONTAINER_ENGINE: docker
        # A package that no longer reproduces is left off the site, not fatal.
        run: python -m nethack_run.cli check --results results --output status.json || echo "::warning::Some packages failed their checks and are not published"
      - name: Build site
        env:
          PYTHONPATH: harness/src
        run: python -m nethack_run.cli build-site results --status status.json --output _site --cname menace.bitplane.net
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
