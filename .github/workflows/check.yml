# Check a submission. Pull requests are data: this job has no secrets and a
# read-only token, may only add attempts/<id>/ package files (or a
# disqualified.json), and replays packages from official images in a
# network-less, read-only container.
name: Check submission

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: results
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bitplane/menacebench
          ref: master
          path: harness
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r harness/requirements.lock
      - name: Check changed packages
        env:
          PYTHONPATH: harness/src
          NETHACK_CONTAINER_ENGINE: docker
          BASE: origin/${{ github.base_ref }}
        run: python -m nethack_run.cli check --results results --changed-from "$BASE" --output status.json
      - name: Summarize
        if: always()
        run: |
          if [ -f status.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          print('| Attempt | Status | Reason |\n|---|---|---|')
          for ident, r in sorted(json.load(open('status.json')).items()):
              print(f"| `{ident}` | {r['status']} | {r['reason']} |")
          PY
          fi
